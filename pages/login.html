<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - Hostel Management System</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <div class="header">
            <h1>Preference Based Hostel Management System</h1>
            <p>Create your Account</p>
        </div>
        <div class="nav">
            <a href="../index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>
    <div class="form-container">
        <h2 style="text-align: center; margin-bottom: 20px">Login</h2>
        <div id="errorMessage" style="display: none; padding: 10px; margin-bottom: 20px; border-radius: 5px; text-align:center;"></div>
        <form action="../controller/Authcontroller.php" method="POST">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email"  id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" id="password" required>
            </div>
            <br>
            <button type="submit" name="login" class="btn" style="width:100%">Login</button>
        </form>
        <p style="text-align: center; margin-top: 20px;">
            Don't have an Account?<a href="register.html">Register here</a>
        </p>
    </div>
    <div class="footer">
        <p> &copy; 2026 Preference Based Hostel Management System.All rights reserved</p>
    </div>
    <script>
    function hideMessages() {
        document.getElementById('errorMessage').style.display = 'none';
    }
    //Hide message When user starts typing
    document.getElementById('email').addEventListener('focus', hideMessages);
    document.getElementById('password').addEventListener('focus', hideMessages);
    
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');

    if(error === 'wrong_password') {
        const msgDiv = document.getElementById('errorMessage');
        msgDiv.style.display = 'block';
        msgDiv.style.backgroundColor = '#f8d7da';
        msgDiv.style.color = '#721c24';
        msgDiv.innerHTML = 'Wrong password. Please try again.';
    } else if(error === 'user_not_found') {
        const msgDiv = document.getElementById('errorMessage');
        msgDiv.style.display = 'block';
        msgDiv.style.backgroundColor = '#f8d7da';
        msgDiv.style.color = '#721c24';
        msgDiv.innerHTML = 'User not found. Please register first.';
    }
    if(error){
        setTimeout(function(){
            document.getElementById('errorMessage').style.display = 'none';
        }, 4000);
    }
    // Clean URL
    if(error) {
        const newUrl = window.location.pathname;
        window.history.replaceState({}, document.title, newUrl);
    }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Payment</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="header">
        <h1>Preference Based Hostel Fee Management</h1>
        <p>View and Pay your fees</p>
    </div>

    <div class="nav">
        <a href="student_dashboard.html">Dashboard</a>
        <a href="student_profile.html">Profile</a>
        <a href="preferences.html">Preferences</a>
        <a href="notifications.html">Notifications</a>
        <a href="student_payment.html">Payments</a>
        <a href="../controller/logout.php">Logout</a>
    </div>
    <div class="payment-container" id="paymentContainer">
        <h2>Make Payment</h2>
        <div id="info">
            <div class="loading-text">Loading...</div>
        </div>
    </div>
    <div id="history" class="payment-history" style="display: none;">
        <h3>Payment History</h3>
    <div id="historyList"></div>
        </div>

    <div class="footer">
        <p>&copy; 2026 Preference Based Hostel Management System. All Rights reserved</p>
    </div>
    <script>
        let currentAllocationId = null;
        loadData();

        function loadData(){
            fetch('../api/get_payment_data.php')
            .then(response => response.json())
            .then(data => {
                if(data.success){
                    currentAllocationId = data.data.allocation_id;
                    showPaymentInfo(data.data);
                    loadHistory(data.data.allocation_id);
                } else {
                    document.getElementById('info').innerHTML = '<div class="error-msg">No room allocation found</div>';
                }
            })
            .catch(error => {
                document.getElementById('info').innerHTML = '<div class="error-msg">Error Loading data</div>';
            });
        }

        function showPaymentInfo(data){
            const balance = data.balance;
            const isPaid = balance <= 0;

            let html = `
                <div class="balance-display">
                    <div class="label">Balance Due</div>
                    <div class="amount">KES ${Number(balance).toLocaleString()}</div>
                </div>
                <div class="room-info">
                    Room: ${data.room_number} (${data.room_type}) - Total: KES ${Number(data.fee_per_semester).toLocaleString()}
                </div>
                <div style="text-align:center; margin-bottom:10px;">
                    <span>Paid: <span class="paid">KES ${Number(data.paid).toLocaleString()}</span></span>
                </div>
            `;

            if(!isPaid){
                html += `
                    <div class="payment-form">
                        <label>Payment Method</label>
                        <select id="method">
                            <option value="mpesa">M-Pesa</option>
                            <option value="bank">Bank</option>
                        </select>

                        <label>Amount (KES)</label>
                        <input type="number" id="amount" placeholder="Enter amount">

                        <button onclick="makePayment(${data.allocation_id})" class="pay-btn">Pay Now</button>
                    </div>
                `;
            } else {
                html += `<div class="status-paid">Fully Paid! Thank you.</div>`;
            }

            document.getElementById('info').innerHTML = html;
        }

        function loadHistory(allocationId){
            fetch('../api/get_payment_history.php')
                .then(response => response.json())
                .then(data => {
                    if(data.payments && data.payments.length > 0){
                        let html = '<table><tr><th>Date</th><th>Amount</th><th>Method</th></tr>';
                        for(let p of data.payments){
                            html += `<tr>
                                <td>${p.payment_date}</td>
                                <td>KES ${Number(p.amount).toLocaleString()}</td>
                                <td>${p.payment_method}</td>
                            </tr>`;
                        }
                        html += '</table>';
                        document.getElementById('historyList').innerHTML = html;
                        document.getElementById('history').style.display = 'block';
                    }
                });
        }

        function makePayment(allocationId){
            const amount = document.getElementById('amount').value;
            const method = document.getElementById('method').value;

            if(!amount || amount <= 0){
                alert('Enter valid amount');
                return;
            }

            const formData = new FormData();
            formData.append('allocation_id', allocationId);
            formData.append('amount', amount);
            formData.append('payment_method', method);

            fetch('../controller/make_payment.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                if(data.includes('success') || data.includes('recorded')){
                    alert('Payment successful!');
                    location.reload();
                } else {
                    alert('Error: ' + data);
                }
            })
            .catch(error => {
                alert('Payment failed');
            });
        }
    </script>
</body>
</html>

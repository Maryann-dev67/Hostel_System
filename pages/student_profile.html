<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="header">
        <h1>Preference Based Hostel Management system</h1>
        <p>Complete Your Profile</p>
    </div>

    <div class="nav">
        <a href="student_dashboard.html">Dashboard</a>
        <a href="student_profile.html">Profile</a>
        <a href="preferences.html">Preferences</a>
        <a href="notifications.html">Notifications</a>
        <a href="student_payment.html">Payments</a>
        <a href="../controller/logout.php">Logout</a>
    </div>

    <div class="form-container">
        <h2 style="text-align: center;margin-bottom: 20px;">Student Profile Information</h2>
        <div id="message" style="display: none; padding: 10px; margin-bottom: 20px; border-radius: 5px; text-align: center;"></div>
        <form id="profileForm" action="../controller/studentController.php" method="POST">
            <input type="hidden" name="save_profile" value="1">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" placeholder="Full Name" required>
            </div>

            <div class="form-group">
                <label>Registration Number</label>
                <input type="text" name="reg_no" placeholder="Registration Number" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="" disabled selected>Select Gender</option>
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label>Course</label>
                <input type="text" name="course" placeholder="Course" required>
            </div>

            <div class="form-group">
                <label>Year of Study</label>
                <select name="year_of_study" required>
                    <option value="" disabled selected>Select Year</option>
                    <option value="1">Year 1</option>
                    <option value="2">Year 2</option>
                    <option value="3">Year 3</option>
                    <option value="4">Year 4</option>
                </select>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone" placeholder="Phone">
            </div>

            <button type="submit" class="btn" style="width:100%; ">Save Profile</button>
        </form>
    </div>
    <div class="footer">
        <p>&copy; 2026 Preference Based Hostel Management System</p>
    </div>
    <script>
        const messageDiv = document.getElementById('message');

        function showMessage(text, isError = false) {
            messageDiv.style.display = 'block';
            messageDiv.textContent = text;
            
            if (isError) {
                messageDiv.style.backgroundColor = '#f8d7da';
                messageDiv.style.color = '#721c24';
                messageDiv.style.border = '1px solid #f5c6cb';
            } else {
                messageDiv.style.backgroundColor = '#d4edda';
                messageDiv.style.color = '#155724';
                messageDiv.style.border = '1px solid #c3e6cb';
            }
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 4000);
        }
        document.getElementById('profileForm').addEventListener('submit', function(e){
            e.preventDefault();

            const formData = new FormData(this);
            //clear previous messages
            messageDiv.style.display = 'none';
            
            fetch('../controller/studentController.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                const responseText = data.trim();
                console.log('Sever response:', responseText);
                
                if (responseText.includes('updated')) {
                    showMessage( 'Profile updated successfully', false);
                } else if (responseText.includes('saved')) {
                    showMessage( 'Profile saved successfully', false);
                } else if (responseText.includes('Error') || responseText.includes('error')) {
                    showMessage(responseText, true);
                } else {
                    showMessage('Profile saved successfully!', false);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('Error saving profile. Please try again.', true);
            });
        });

    </script>
</body>
</html>
